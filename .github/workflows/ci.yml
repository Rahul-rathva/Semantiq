name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: semantiq
          POSTGRES_PASSWORD: semantiq
          POSTGRES_DB: semantiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semantiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://semantiq:semantiq@localhost:5432/semantiq

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint
        run: flake8 app --max-line-length=120 --extend-ignore=E203,W503

      - name: Run tests
        run: pytest tests/test_health.py -v
