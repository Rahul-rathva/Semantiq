version: "3.9"

services:
  db:
    image: ankane/pgvector:latest
    container_name: semantiq_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: semantiq
      POSTGRES_PASSWORD: semantiq
      POSTGRES_DB: semantiq
    ports:
      - "5432:5432"
    volumes:
      - semantiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semantiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: semantiq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: semantiq_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app

volumes:
  semantiq_pgdata:
